<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Queue</title>
    <script src="/js/coverArt.js" type="module"></script>
    <script src="/js/load.js" type="moudle"></script>
    <script src="/js/leave.js" defer></script>
    <script src="/js/vote.js" defer></script>
    <script src="/js/debug.js"></script>
    <link rel="stylesheet" href="dashboard.css" />
    <link rel="stylesheet" href="universal.css" />
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
  </head>
  <body>
    <div id="topDiv">
      <p>&#8595; Scroll down to vote &#8595;</p>
      <!-- ^^ dette er UTF-8 Arrows             ^^
      -->
    </div>
    <div id="leftDiv">
      <div id="topLeftDiv">
        <h1 id="queueid">'Q' ID: </h1>
        <br />
        <h2>Now playing:</h2>
        <br />
      </div>
      <div id="middleLeftDiv">
        <div id="coverArt"></div>
        <div id="progressBar">
          <div id="timeBar"></div>
        </div>
        <br />
        <h2 id="tracktitle"></h2>
        <br />
        <h3 id="artistname"></h3>
      </div>
      <div id="bottomLeftDiv">
        <div id="leaveButton">
          <a id="leaveButton1" class="button-class" onclick="leaveSession()">Leave Queue</a>
        </div>
      </div>
    </div>
    <div id="rightDiv">
      <div id="topRightDiv">
        <h1>&#8595; VOTE &#8595;</h1>
      </div>
      <div id="bottomRightDiv">
        <div id="leftBottomRightDiv">
          <table class="uneven" id="song0">
            <tr>
              <td class="songClass"></td>
            </tr>
            <tr>
              <td class="artistClass"></td>
            </tr>
          </table>
          <table class="even" id="song1">
            <tr>
              <td class="songClass"></td>
            </tr>
            <tr>
              <td class="artistClass"></td>
            </tr>
          </table>
          <table class="uneven" id="song2">
            <tr>
              <td class="songClass"></td>
            </tr>
            <tr>
              <td class="artistClass"></td>
            </tr>
          </table>
          <table class="even" id="song3">
            <tr>
              <td class="songClass"></td>
            </tr>
            <tr>
              <td class="artistClass"></td>
            </tr>
          </table>
          <table class="uneven" id="song4">
            <tr>
              <td class="songClass"></td>
            </tr>
            <tr>
              <td class="artistClass"></td>
            </tr>
          </table>
          <table class="even" id="song5">
            <tr>
              <td class="songClass"></td>
            </tr>
            <tr>
              <td class="artistClass"></td>
            </tr>
          </table>
          <table class="uneven" id="song6">
            <tr>
              <td class="songClass"></td>
            </tr>
            <tr>
              <td class="artistClass"></td>
            </tr>
          </table>
          <table class="even" id="song7">
            <tr>
              <td class="songClass"></td>
            </tr>
            <tr>
              <td class="artistClass"></td>
            </tr>
          </table>
        </div>
        <div id="rightBottomRightDiv">
          <div id="count">
            <p id="0">0</p>
            <p id="1">0</p>
            <p id="2">0</p>
            <p id="3">0</p>
            <p id="4">0</p>
            <p id="5">0</p>
            <p id="6">0</p>
            <p id="7">0</p>
          </div>
          <div id="buttons">
            <button id="button0" class="voteButton">
              &#8593;</button
            ><button id="button1" class="voteButton">
              &#8593;</button
            ><button id="button2" class="voteButton">
              &#8593;</button
            ><button id="button3" class="voteButton">
              &#8593;</button
            ><button id="button4" class="voteButton">
              &#8593;</button

              &#8593;</button
            ><button id="button6" class="voteButton">
              &#8593;</button
            ><button id="button7" class="voteButton">
              &#8593;
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
